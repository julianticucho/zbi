[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zbi"
version = "0.1.0"
description = "Simulation-Based Inference pipeline with SNPE"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "matplotlib",
    "nflows",
    "zarr",
    "fasteners",
    "tqdm",
    "pyyaml",
    "getdist",
    "SciencePlots",
]

[project.optional-dependencies]
cmb = ["cobaya", "camb", "healpy", "pysm3", "astropy"]
dev = ["ipykernel", "pytest"]

[tool.setuptools.packages.find]
include = ["zbi*"]
